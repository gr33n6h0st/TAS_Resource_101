<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombe M3: Mechanical Cryptanalysis Bank</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Fira+Code:wght@400;700&display=swap');
        
        :root {
            --steel-dark: #1a1a1a;
            --logic-green: #00ff41;
            --lamp-glow: #ffcc00;
            --brass: #c5a059;
            --alert-red: #ff3333;
        }

        body {
            background: #0d0d0d;
            color: #ddd;
            font-family: 'Special Elite', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }

        .chassis {
            background: linear-gradient(145deg, #2a2a2a, #111);
            border: 8px solid #000;
            border-radius: 4px;
            padding: 20px;
            width: 840px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            color: var(--brass);
            font-size: 20px;
            letter-spacing: 3px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
            text-shadow: 0 2px 4px #000;
        }

        /* MECHANICAL DRUM RACK */
        .drum-rack-container {
            background: #050505;
            border: 2px solid #222;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px #000;
        }

        .rack-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        .drum-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .drum-unit {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #3a3a3a, #0a0a0a);
            border: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.9);
            transition: transform 0.05s linear;
        }

        .drum-unit::before {
            content: "";
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px dashed #444;
            pointer-events: none;
        }

        .drum-val {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px var(--brass);
            user-select: none;
        }

        /* PANEL SPLIT */
        .control-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .panel-box {
            background: #050505;
            padding: 15px;
            border-radius: 4px;
            border: 2px solid #222;
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            background: #000;
            color: var(--logic-green);
            border: 1px solid #333;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border-radius: 2px;
            text-transform: uppercase;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--logic-green);
        }

        /* LOGIC MONITOR */
        .logic-monitor {
            background: #000;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--logic-green);
            border-left: 4px solid var(--logic-green);
            line-height: 1.5;
            height: 140px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 6px #000;
        }

        /* ODOMETER & STATUS */
        .status-bay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .odo-display {
            background: #000;
            color: var(--brass);
            font-family: 'Fira Code', monospace;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 12px;
            padding: 8px 20px;
            border: 2px solid #333;
            border-radius: 4px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
            box-shadow: inset 0 2px 8px #000;
        }

        .stop-lamp {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #333, #050505);
            border: 2px solid #111;
            margin-bottom: 12px;
            box-shadow: inset 0 4px 6px #000;
            transition: all 0.2s ease;
        }

        .stop-lamp.hit {
            background: radial-gradient(circle at 30% 30%, #fff, var(--alert-red));
            box-shadow: 0 0 30px var(--alert-red);
            border-color: #fff;
        }

        /* TAPE READOUT */
        .tape-readout {
            background: #fdfae6;
            color: #222;
            padding: 8px 12px;
            font-size: 15px;
            letter-spacing: 3px;
            border-radius: 2px;
            min-height: 20px;
            text-align: left;
            margin-bottom: 15px;
            border-left: 6px solid #34495e;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            font-family: 'Special Elite', serif;
            word-break: break-all;
        }

        /* CONTROLS */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 10px 18px;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Special Elite', serif;
            font-size: 11px;
            transition: background 0.15s ease;
        }

        button:hover {
            background: #3a3a3a;
            color: #fff;
        }

        .btn-run {
            background: #7f1d1d;
            border-color: #991b1b;
            color: #fff;
            font-weight: bold;
        }

        .btn-run:hover {
            background: #991b1b;
        }
    </style>
</head>
<body onload="init()">

    <div class="chassis">
        <h1 class="header-title">Bombe M3: Mechanical Logic Bank</h1>

        <!-- DRUM RACK -->
        <div class="drum-rack-container">
            <div class="rack-label">ROTATING ROTOR COMMUTATOR BANKS (36 DRUMS)</div>
            <div class="drum-grid" id="drum-grid"></div>
        </div>

        <!-- CONTROL & LOGIC PANELS -->
        <div class="control-panels">
            <!-- INPUT PANEL -->
            <div class="panel-box">
                <div class="panel-title">Intercept & Crib Input</div>
                <label style="font-size: 10px; color: #666;">INTERCEPTED CIPHERTEXT:</label>
                <input type="text" id="cipher-in" placeholder="e.g. ILBDA" value="ILBDA">
                
                <label style="font-size: 10px; color: #666;">ENGLISH CRIB (KNOWN WORD):</label>
                <input type="text" id="crib-in" placeholder="e.g. HELLO" value="HELLO">

                <div class="panel-title" style="margin-top: 5px;">Decrypted Message Tape</div>
                <div id="output-tape" class="tape-readout" style="border-left-color: #b08d57;">WAITING...</div>
            </div>

            <!-- LOGIC MONITOR & STATUS -->
            <div class="panel-box style="display: flex; flex-direction: column;">
                <div class="panel-title">Logical Deduction Trace</div>
                <div class="logic-monitor" id="logic-box">> STANDBY: AWAITING MOTOR START COMMAND...</div>
            </div>
        </div>

        <!-- MOTOR STATUS & BUTTONS -->
        <div class="panel-box" style="margin-bottom: 20px; display: flex; justify-content: space-around; align-items: center;">
            <div class="status-bay">
                <div class="panel-title">CURRENT ROTOR POSITION</div>
                <div class="odo-display" id="odo-display">A A A</div>
            </div>

            <div class="status-bay">
                <div class="panel-title">CONTRADICTION STOP LAMP</div>
                <div class="stop-lamp" id="stop-lamp"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-run" id="run-btn" onclick="toggleBombe()">RUN BOMBE MOTOR</button>
            <button onclick="stepOnePosition()">STEP SINGLE (+1)</button>
            <button onclick="resetBombe()" style="background:#455a64">RESET MOTOR (AAA)</button>
            <button onclick="clearLogs()" style="background:#263238">CLEAR LOGS</button>
        </div>
    </div>

<script>
    const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const rotors = [
        "EKMFLGDQVZNTOWYHXUSPAIBRCJ", // Rotor I
        "AJDKSIRUXBLHWTMCQGZNPYFVOE", // Rotor II
        "BDFHJLCPRTXVZNYEIWGAKMUSQO"  // Rotor III
    ];
    const reflector = "YRUHQSLDPXNGOKMIEBFZCWVJAT"; // Reflector B

    let isRunning = false;
    let p = [0, 0, 0]; // Rotor starting indices (0=A, 1=B, etc.)
    let scanTimer = null;

    function init() {
        const grid = document.getElementById('drum-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 36; i++) {
            grid.innerHTML += `
                <div class="drum-unit" id="drum-${i}">
                    <span class="drum-val">${alpha[p[i % 3]]}</span>
                </div>`;
        }
        updateUI();
    }

    // Exact Enigma M3 Encryption Matching the Engineering Lab Site
    function enigmaTransform(char, startPos) {
        let pos = [...startPos];

        // Step Rotors
        pos[2] = (pos[2] + 1) % 26;
        if (pos[2] === 17) {
            pos[1] = (pos[1] + 1) % 26;
            if (pos[1] === 17) {
                pos[0] = (pos[0] + 1) % 26;
            }
        }

        let idx = alpha.indexOf(char);

        // Forward Pass (Rotor III -> II -> I)
        for (let i = 2; i >= 0; i--) {
            idx = (idx + pos[i]) % 26;
            idx = alpha.indexOf(rotors[i][idx]);
            idx = (idx - pos[i] + 26) % 26;
        }

        // Reflector B
        idx = alpha.indexOf(reflector[idx]);

        // Return Pass (Rotor I -> II -> III)
        for (let i = 0; i <= 2; i++) {
            idx = (idx + pos[i]) % 26;
            idx = rotors[i].indexOf(alpha[idx]);
            idx = (idx - pos[i] + 26) % 26;
        }

        return alpha[idx];
    }

    function testString(text, startPos) {
        let currentPos = [...startPos];
        let result = "";
        for (let i = 0; i < text.length; i++) {
            let resChar = enigmaTransform(text[i], currentPos);
            result += resChar;
            // Advance internal rotor states for subsequent characters
            currentPos[2] = (currentPos[2] + 1) % 26;
            if (currentPos[2] === 17) {
                currentPos[1] = (currentPos[1] + 1) % 26;
                if (currentPos[1] === 17) {
                    currentPos[0] = (currentPos[0] + 1) % 26;
                }
            }
        }
        return result;
    }

    function toggleBombe() {
        if (isRunning) {
            stopBombe();
        } else {
            startBombe();
        }
    }

    function startBombe() {
        const cipher = document.getElementById('cipher-in').value.toUpperCase().replace(/[^A-Z]/g, "");
        const crib = document.getElementById('crib-in').value.toUpperCase().replace(/[^A-Z]/g, "");

        if (!cipher || !crib) {
            alert("Please enter both an Intercepted Cipher and an English Crib!");
            return;
        }

        if (cipher.length !== crib.length) {
            log("> WARNING: Cipher and Crib lengths differ. Testing substring crib alignment...");
        }

        isRunning = true;
        document.getElementById('run-btn').innerText = "STOP MOTOR";
        document.getElementById('stop-lamp').classList.remove('hit');
        log(`> BOMBE MOTOR STARTED.\n> SCANNING ROTOR POSITIONS (17,576 KEYS)...`);

        runScanBatch();
    }

    function stopBombe() {
        isRunning = false;
        clearTimeout(scanTimer);
        document.getElementById('run-btn').innerText = "RUN BOMBE MOTOR";
        log("> MOTOR STOPPED BY OPERATOR.");
    }

    function runScanBatch() {
        if (!isRunning) return;

        const cipher = document.getElementById('cipher-in').value.toUpperCase().replace(/[^A-Z]/g, "");
        const crib = document.getElementById('crib-in').value.toUpperCase().replace(/[^A-Z]/g, "");

        // Process a batch of 150 combinations per frame to keep visual updates smooth
        let iterations = 0;
        let matchFound = false;

        while (iterations < 150 && isRunning) {
            let testResult = testString(crib, p);

            if (testResult === cipher) {
                matchFound = true;
                break;
            }

            // Increment rotor positions: R -> M -> L
            p[2]++;
            if (p[2] >= 26) {
                p[2] = 0;
                p[1]++;
                if (p[1] >= 26) {
                    p[1] = 0;
                    p[0]++;
                    if (p[0] >= 26) {
                        // Entire key space searched
                        updateUI();
                        stopBombe();
                        log("> SCAN COMPLETE: NO MATCHING ROTOR SETTING FOUND.");
                        return;
                    }
                }
            }
            iterations++;
        }

        updateUI();

        if (matchFound) {
            isRunning = false;
            document.getElementById('run-btn').innerText = "RUN BOMBE MOTOR";
            document.getElementById('stop-lamp').classList.add('hit');
            
            let posStr = p.map(x => alpha[x]).join(" ");
            log(`\n*** CONTRADICTION HIT DETECTED ***\n> SETTING FOUND AT ROTORS: [ ${posStr} ]`);
            
            let decrypted = testString(cipher, p);
            document.getElementById('output-tape').innerText = decrypted;
        } else {
            scanTimer = setTimeout(runScanBatch, 10);
        }
    }

    function stepOnePosition() {
        p[2]++;
        if (p[2] >= 26) { p[2] = 0; p[1]++; }
        if (p[1] >= 26) { p[1] = 0; p[0]++; }
        if (p[0] >= 26) { p = [0, 0, 0]; }
        updateUI();
    }

    function resetBombe() {
        stopBombe();
        p = [0, 0, 0];
        document.getElementById('stop-lamp').classList.remove('hit');
        document.getElementById('output-tape').innerText = "WAITING...";
        updateUI();
        log("> RESET ROTOR SETTINGS TO AAA.");
    }

    function updateUI() {
        const posStr = p.map(x => alpha[x]).join(" ");
        document.getElementById('odo-display').innerText = posStr;

        for (let i = 0; i < 36; i++) {
            const drum = document.getElementById(`drum-${i}`);
            const valSpan = drum.querySelector('.drum-val');
            const letter = alpha[p[i % 3]];
            valSpan.innerText = letter;
            
            // Visual rotation effect
            const rotDeg = p[i % 3] * 13.84;
            drum.style.transform = `rotate(${rotDeg}deg)`;
            valSpan.style.transform = `rotate(-${rotDeg}deg)`;
        }
    }

    function log(msg) {
        const box = document.getElementById('logic-box');
        box.innerText = msg + "\n" + box.innerText;
    }

    function clearLogs() {
        document.getElementById('logic-box').innerText = "> LOGS CLEARED. STANDBY...";
    }
</script>
</body>
</html>
