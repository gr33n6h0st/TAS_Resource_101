<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombe M3: Mechanical Cryptanalysis Bank</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Fira+Code:wght@400;700&display=swap');
        
        :root {
            --steel-dark: #1a1a1a;
            --logic-green: #00ff41;
            --lamp-glow: #ffcc00;
            --brass: #c5a059;
            --alert-red: #ff3333;
        }

        body {
            background: #0d0d0d;
            color: #ddd;
            font-family: 'Special Elite', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }

        .chassis {
            background: linear-gradient(145deg, #2a2a2a, #111);
            border: 8px solid #000;
            border-radius: 4px;
            padding: 20px;
            width: 860px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            color: var(--brass);
            font-size: 20px;
            letter-spacing: 3px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            border-bottom: 2px solid #222;
            padding-bottom: 10px;
            text-shadow: 0 2px 4px #000;
        }

        /* MECHANICAL DRUM RACK */
        .drum-rack-container {
            background: #050505;
            border: 2px solid #222;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px #000;
        }

        .rack-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        .drum-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 8px;
            justify-items: center;
        }

        .drum-unit {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #3a3a3a, #0a0a0a);
            border: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.9);
            transition: transform 0.08s ease-out;
        }

        .drum-unit.active {
            border-color: var(--logic-green);
            box-shadow: 0 0 10px var(--logic-green);
        }

        .drum-val {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px var(--brass);
            user-select: none;
        }

        /* PANEL SPLIT */
        .control-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .panel-box {
            background: #050505;
            padding: 15px;
            border-radius: 4px;
            border: 2px solid #222;
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            background: #000;
            color: var(--logic-green);
            border: 1px solid #333;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border-radius: 2px;
            text-transform: uppercase;
            outline: none;
        }

        .logic-monitor {
            background: #000;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--logic-green);
            border-left: 4px solid var(--logic-green);
            line-height: 1.5;
            height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 6px #000;
        }

        .odo-display {
            background: #000;
            color: var(--brass);
            font-family: 'Fira Code', monospace;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 10px;
            padding: 8px 16px;
            border: 2px solid #333;
            border-radius: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
            text-align: center;
        }

        .stop-lamp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #333, #050505);
            border: 2px solid #111;
            box-shadow: inset 0 4px 6px #000;
            transition: all 0.2s ease;
        }

        .stop-lamp.hit {
            background: radial-gradient(circle at 30% 30%, #fff, var(--alert-red));
            box-shadow: 0 0 30px var(--alert-red);
            border-color: #fff;
        }

        .live-candidate {
            background: #111;
            border: 1px solid #333;
            padding: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: var(--lamp-glow);
            text-align: center;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Special Elite', serif;
            font-size: 11px;
        }

        button:hover { background: #3a3a3a; color: #fff; }

        .btn-run { background: #7f1d1d; border-color: #991b1b; color: #fff; font-weight: bold; }
        .btn-run:hover { background: #991b1b; }

        .speed-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: #888;
            background: #000;
            padding: 6px 12px;
            border: 1px solid #222;
        }
    </style>
</head>
<body onload="init()">

    <div class="chassis">
        <h1 class="header-title">Bombe M3: Mechanical Logic Bank</h1>

        <!-- DRUM RACK -->
        <div class="drum-rack-container">
            <div class="rack-label">ROTATING ROTOR COMMUTATOR BANKS (36 DRUMS)</div>
            <div class="drum-grid" id="drum-grid"></div>
        </div>

        <!-- CONTROL & LOGIC PANELS -->
        <div class="control-panels">
            <!-- INPUT PANEL -->
            <div class="panel-box">
                <div class="panel-title">Intercept & Crib Input</div>
                <label style="font-size: 10px; color: #666;">INTERCEPTED CIPHERTEXT:</label>
                <input type="text" id="cipher-in" value="ILBDA">
                
                <label style="font-size: 10px; color: #666;">ENGLISH CRIB (KNOWN WORD):</label>
                <input type="text" id="crib-in" value="HELLO">

                <div class="panel-title" style="margin-top: 5px;">Live Decryption Output</div>
                <div class="live-candidate" id="live-candidate">---</div>
            </div>

            <!-- LOGIC MONITOR -->
            <div class="panel-box">
                <div class="panel-title">Logical Deduction Trace</div>
                <div class="logic-monitor" id="logic-box">> STANDBY: AWAITING MOTOR START...</div>
            </div>
        </div>

        <!-- ODOMETER & CONTROLS -->
        <div class="panel-box" style="margin-bottom: 20px; display: flex; justify-content: space-around; align-items: center;">
            <div>
                <div class="panel-title" style="text-align: center;">TESTING KEY</div>
                <div class="odo-display" id="odo-display">A A A</div>
            </div>

            <div class="speed-box">
                <span>MOTOR SPEED:</span>
                <select id="speed-select" style="background:#111; color:#00ff41; border:1px solid #333; padding:4px;">
                    <option value="150">Visual Step (Slow)</option>
                    <option value="30" selected>Medium Scan</option>
                    <option value="1">Turbo Scan (Fast)</option>
                </select>
            </div>

            <div>
                <div class="panel-title" style="text-align: center;">MATCH LAMP</div>
                <div class="stop-lamp" id="stop-lamp"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-run" id="run-btn" onclick="toggleBombe()">RUN BOMBE MOTOR</button>
            <button onclick="stepSingle()">STEP SINGLE (+1)</button>
            <button onclick="resetBombe()" style="background:#455a64">RESET TO (AAA)</button>
            <button onclick="clearLogs()" style="background:#263238">CLEAR LOGS</button>
        </div>
    </div>

<script>
    const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const rotors = [
        "EKMFLGDQVZNTOWYHXUSPAIBRCJ", // Rotor I
        "AJDKSIRUXBLHWTMCQGZNPYFVOE", // Rotor II
        "BDFHJLCPRTXVZNYEIWGAKMUSQO"  // Rotor III
    ];
    const reflector = "YRUHQSLDPXNGOKMIEBFZCWVJAT"; // Reflector B

    let isRunning = false;
    let p = [0, 0, 0]; // Rotor indices
    let scanTimer = null;

    function init() {
        const grid = document.getElementById('drum-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 36; i++) {
            grid.innerHTML += `<div class="drum-unit" id="drum-${i}"><span class="drum-val">${alpha[p[i % 3]]}</span></div>`;
        }
        updateUI();
    }

    // Exact Enigma M3 Logic
    function enigmaTransform(char, startPos) {
        let pos = [...startPos];

        // Step Rotors
        pos[2] = (pos[2] + 1) % 26;
        if (pos[2] === 17) {
            pos[1] = (pos[1] + 1) % 26;
            if (pos[1] === 17) {
                pos[0] = (pos[0] + 1) % 26;
            }
        }

        let idx = alpha.indexOf(char);

        // Forward Pass
        for (let i = 2; i >= 0; i--) {
            idx = (idx + pos[i]) % 26;
            idx = alpha.indexOf(rotors[i][idx]);
            idx = (idx - pos[i] + 26) % 26;
        }

        // Reflector
        idx = alpha.indexOf(reflector[idx]);

        // Return Pass
        for (let i = 0; i <= 2; i++) {
            idx = (idx + pos[i]) % 26;
            idx = rotors[i].indexOf(alpha[idx]);
            idx = (idx - pos[i] + 26) % 26;
        }

        return alpha[idx];
    }

    function testCrib(crib, startPos) {
        let currentPos = [...startPos];
        let result = "";
        for (let i = 0; i < crib.length; i++) {
            let outChar = enigmaTransform(crib[i], currentPos);
            result += outChar;
            currentPos[2] = (currentPos[2] + 1) % 26;
            if (currentPos[2] === 17) {
                currentPos[1] = (currentPos[1] + 1) % 26;
                if (currentPos[1] === 17) currentPos[0] = (currentPos[0] + 1) % 26;
            }
        }
        return result;
    }

    function toggleBombe() {
        if (isRunning) stopBombe();
        else startBombe();
    }

    function startBombe() {
        const cipher = document.getElementById('cipher-in').value.toUpperCase().replace(/[^A-Z]/g, "");
        const crib = document.getElementById('crib-in').value.toUpperCase().replace(/[^A-Z]/g, "");

        if (!cipher || !crib) {
            alert("Enter both Ciphertext and Crib!");
            return;
        }

        isRunning = true;
        document.getElementById('run-btn').innerText = "STOP MOTOR";
        document.getElementById('stop-lamp').classList.remove('hit');
        log(`> MOTOR STARTED. TESTING KEY SPACE FROM [ ${p.map(x=>alpha[x]).join(" ")} ]...`);

        scanStep();
    }

    function stopBombe() {
        isRunning = false;
        clearTimeout(scanTimer);
        document.getElementById('run-btn').innerText = "RUN BOMBE MOTOR";
        log("> MOTOR STOPPED.");
    }

    function scanStep() {
        if (!isRunning) return;

        const cipher = document.getElementById('cipher-in').value.toUpperCase().replace(/[^A-Z]/g, "");
        const crib = document.getElementById('crib-in').value.toUpperCase().replace(/[^A-Z]/g, "");

        let candidate = testCrib(crib, p);
        let keyStr = p.map(x => alpha[x]).join(" ");

        document.getElementById('live-candidate').innerText = `${crib} -> ${candidate}`;

        if (candidate === cipher) {
            // MATCH FOUND
            isRunning = false;
            document.getElementById('run-btn').innerText = "RUN BOMBE MOTOR";
            document.getElementById('stop-lamp').classList.add('hit');
            updateUI();
            log(`\n*** MATCH DETECTED ***\n> ROTOR KEY: [ ${keyStr} ]\n> CRIB '${crib}' MATCHES CIPHER '${cipher}'`);
            return;
        }

        // Advance Key Space
        p[2]++;
        if (p[2] >= 26) {
            p[2] = 0;
            p[1]++;
            if (p[1] >= 26) {
                p[1] = 0;
                p[0]++;
                if (p[0] >= 26) {
                    isRunning = false;
                    document.getElementById('run-btn').innerText = "RUN BOMBE MOTOR";
                    log("> KEY SPACE EXHAUSTED. NO MATCH FOUND.");
                    return;
                }
            }
        }

        updateUI();
        let speed = parseInt(document.getElementById('speed-select').value);
        scanTimer = setTimeout(scanStep, speed);
    }

    function stepSingle() {
        const cipher = document.getElementById('cipher-in').value.toUpperCase().replace(/[^A-Z]/g, "");
        const crib = document.getElementById('crib-in').value.toUpperCase().replace(/[^A-Z]/g, "");
        
        let candidate = testCrib(crib, p);
        let keyStr = p.map(x => alpha[x]).join(" ");
        
        document.getElementById('live-candidate').innerText = `${crib} -> ${candidate}`;
        
        if (candidate === cipher) {
            document.getElementById('stop-lamp').classList.add('hit');
            log(`> SINGLE STEP: MATCH AT [ ${keyStr} ]!`);
        } else {
            log(`> [ ${keyStr} ] TESTED: '${candidate}' != '${cipher}' (REJECTED)`);
            p[2]++;
            if (p[2] >= 26) { p[2] = 0; p[1]++; }
            if (p[1] >= 26) { p[1] = 0; p[0]++; }
            if (p[0] >= 26) p = [0, 0, 0];
        }
        updateUI();
    }

    function resetBombe() {
        stopBombe();
        p = [0, 0, 0];
        document.getElementById('stop-lamp').classList.remove('hit');
        document.getElementById('live-candidate').innerText = "---";
        updateUI();
        log("> RESET TO AAA.");
    }

    function updateUI() {
        const posStr = p.map(x => alpha[x]).join(" ");
        document.getElementById('odo-display').innerText = posStr;

        for (let i = 0; i < 36; i++) {
            const drum = document.getElementById(`drum-${i}`);
            const valSpan = drum.querySelector('.drum-val');
            const letter = alpha[p[i % 3]];
            valSpan.innerText = letter;
            
            const rotDeg = p[i % 3] * 13.84;
            drum.style.transform = `rotate(${rotDeg}deg)`;
            valSpan.style.transform = `rotate(-${rotDeg}deg)`;
        }
    }

    function log(msg) {
        const box = document.getElementById('logic-box');
        box.innerText = msg + "\n" + box.innerText;
    }

    function clearLogs() {
        document.getElementById('logic-box').innerText = "> LOGS CLEARED.";
    }
</script>
</body>
</html>
